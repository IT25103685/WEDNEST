# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# Microsoft SQL Server connection
# Change these 4 values to match your own SQL Server instance.
# ===============================
db.url=jdbc:sqlserver://localhost:1433;databaseName=WeddingSystemDB;encrypt=true;trustServerCertificate=true
db.username=sa
db.password=54321
db.driver=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Disable default Spring Boot DataSource auto-configuration
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

# ===============================
# JSP view resolver
# ===============================
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# Static resources (css/js)
spring.web.resources.static-locations=classpath:/static/,file:src/main/webapp/resources/

# Session
server.servlet.session.timeout=60m
